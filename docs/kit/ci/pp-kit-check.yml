# Mẫu GitHub Action do pp-kit init ghi. Chuyển file này vào .github/workflows/ để dùng.
# Kiểm docs/ của PR bằng script của kit, lấy về đúng version 3.3.0 (ref v3.3.0); lên kit mới thì đổi ref.
# Repo pp-techs/pp-kit là private: tạo secret PP_KIT_TOKEN (token chỉ đọc nội dung repo đó). Script không nằm trong repo dự án nên PR không sửa được luật kiểm của chính nó.
# Bình luận tóm tắt lên PR: một bình luận, sửa lại mỗi lần đẩy; PR từ fork (token chỉ đọc) thì bỏ qua bình luận.
# Chỉ LỖI mới của PR chặn merge (--new-only); LỖI có sẵn trên nhánh gốc được nêu riêng trong bình luận, không chặn.
name: pp-kit check
on:
  pull_request:
    paths: ['docs/**']
permissions:
  contents: read
  pull-requests: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: pp-techs/pp-kit
          ref: v3.3.0
          path: .pp-kit
          token: ${{ secrets.PP_KIT_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: check và stale
        id: check
        run: |
          set +e
          node .pp-kit/plugins/pp-kit/scripts/check.mjs --docs docs --base origin/${{ github.base_ref }} --new-only --json > pp-kit-check.json
          echo "code=$?" >> "$GITHUB_OUTPUT"
          node .pp-kit/plugins/pp-kit/scripts/stale.mjs --docs docs --json > pp-kit-stale.json
          exit 0
      - name: comment lên PR
        uses: actions/github-script@v7
        continue-on-error: true
        env:
          CHECK_CODE: ${{ steps.check.outputs.code }}
        with:
          script: |
            const fs = require('fs');
            const read = (f) => {
              try {
                return JSON.parse(fs.readFileSync(f, 'utf8'));
              } catch {
                return null;
              }
            };
            const c = read('pp-kit-check.json');
            const s = read('pp-kit-stale.json');
            const marker = '<!-- pp-kit-check -->';
            const out = [marker];
            if (!c || !Array.isArray(c.issues)) {
              out.push(`### pp-kit check không chạy được (mã thoát ${process.env.CHECK_CODE})`, '', String(c?.error ?? 'không đọc được pp-kit-check.json'));
            } else {
              const n = (k) => c.counts?.[k] ?? 0;
              // check --new-only: issue có preexisting (có sẵn trên nhánh gốc), JSON có newErrors; bản check cũ không có hai trường
              // này thì bình luận như trước
              const split = typeof c.newErrors === 'number' || c.issues.some((i) => typeof i?.preexisting === 'boolean');
              const pre = c.issues.filter((i) => i.level === 'LỖI' && i.preexisting === true).length;
              const fresh = typeof c.newErrors === 'number' ? c.newErrors : n('LỖI') - pre;
              out.push(`### pp-kit check: ${n('LỖI')} LỖI${split ? ` (${fresh} mới; ${pre} có sẵn trên nhánh gốc, không chặn PR)` : ''}, ${n('CẢNH BÁO')} CẢNH BÁO, ${n('NGƯỜI')} NGƯỜI`);
              if (split && pre) out.push('', 'LỖI có sẵn trên nhánh gốc không do PR này: sửa ở một PR riêng.');
              // mục mới trước, mục có sẵn sau (danh sách cắt ở 50 mục)
              const list = split ? [...c.issues.filter((i) => !i.preexisting), ...c.issues.filter((i) => i.preexisting)] : c.issues;
              out.push(...list.slice(0, 50).map((i) => `- ${i.level}${split && i.preexisting ? ' (có sẵn)' : ''} \`${i.rule}\` ${i.file ?? ''}${i.line ? ':' + i.line : ''} ${i.message}`));
            }
            if (s && Array.isArray(s.stale)) {
              out.push('', `Test case, task sẽ cũ: ${s.stale.length}`, ...s.stale.slice(0, 30).map((x) => `- ${x.dependent} ← ${x.code} (${x.current})`));
            }
            const body = out.join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            try {
              const all = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
              const old = all.find((x) => String(x.body ?? '').startsWith(marker));
              if (old) await github.rest.issues.updateComment({ owner, repo, comment_id: old.id, body });
              else await github.rest.issues.createComment({ owner, repo, issue_number, body });
            } catch (e) {
              core.warning(`không ghi được bình luận lên PR (PR từ fork chỉ có quyền đọc?): ${e.message}`);
            }
      - name: chặn khi có LỖI mới
        if: steps.check.outputs.code != '0'
        run: exit 1
